name: Bump gitwarren

# Keeps the cask pointed at the latest published release of
# klarluft/gitwarren-app. Three ways in:
#
#  - repository_dispatch: sent by the app repository the moment a release is
#    published, when it has a token for this repository. The fast path.
#  - schedule: the fallback, so a release is picked up within a few hours
#    even if the dispatch never arrives.
#  - workflow_dispatch: by hand, optionally pinning a tag.
#
# Whatever the trigger, the result is the same: re-resolve the release,
# rewrite the cask, and commit if anything changed.

on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bump to (blank = latest published)
        required: false

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    # macOS so that `brew audit --cask` runs the same checks a user's machine
    # would, and so `shasum` matches the one the cask maintainers use.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
        run: scripts/bump.sh "$TAG"

      - name: Anything to commit?
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cask already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff
          fi

      # `brew tap <path>` clones the checkout, so it sees committed history and
      # not the working tree. Commit before auditing, or every check below runs
      # against the *previous* release's cask and silently proves nothing.
      # Nothing is pushed until the audit passes, so a bad bump stays local.
      - name: Commit the bump
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gitwarren $(sed -nE 's/^  version "(.*)"$/\1/p' Casks/gitwarren.rb)"

      # Homebrew wants to read the cask from a tap, not a path, so make this
      # checkout the tap. --online fetches both disk images and verifies the
      # checksums just written, which is the check that actually matters.
      - name: Audit the cask
        if: steps.diff.outputs.changed == 'true'
        # `--online` asks the GitHub API about the repository behind the cask,
        # and asks anonymously unless this is set: 60 requests an hour, counted
        # per IP and so shared with every other job on the runner's address.
        # Exhausting it fails the audit, which skips the push, which leaves the
        # cask a release behind - and it surfaces as `exception while auditing`
        # rather than as anything resembling a quota, so the bump looks broken
        # rather than throttled. The job's own token needs no permissions for
        # this and lifts the limit to 1000 an hour.
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap klarluft/tap "$GITHUB_WORKSPACE"
          brew style klarluft/tap
          brew audit --cask --online --strict klarluft/tap/gitwarren
          brew fetch --cask --arch intel klarluft/tap/gitwarren

      - name: Push
        if: steps.diff.outputs.changed == 'true'
        run: git push
